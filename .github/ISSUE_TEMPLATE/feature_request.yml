name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你的使用场景或痛点，而不只是方案
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的行为
      description: 你希望 WheelVolume 怎么做
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他做法（可选）
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - "核心调节逻辑"
        - "配置项"
        - "界面/浮层"
        - "安装/分发"
        - "文档"
        - "其他"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认事项
      options:
        - label: 已搜索过现有 Issue 与 Discussions，确认不是重复建议
          required: true
